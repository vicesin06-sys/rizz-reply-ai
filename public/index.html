<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f5"><title>Rizz Reply AI</title>
<style>
:root{--bg:#fff7f5;--card:#fff;--ink:#2a1a1f;--mute:#7a6168;--line:#f0d9d9;--acc:#e8456b;--acc2:#ff8a5c;--chip:#fde8ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1114;--card:#261a1e;--ink:#f6e9ec;--mute:#b79ca3;--line:#3a2a30;--chip:#3a2128}}
:root[data-theme=dark]{--bg:#1a1114;--card:#261a1e;--ink:#f6e9ec;--mute:#b79ca3;--line:#3a2a30;--chip:#3a2128}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mute);margin:0 0 18px}
.card,.reply{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}label.h{display:block;font-weight:600;font-size:13px;color:var(--mute);margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px}
textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);font:inherit}textarea:focus{outline:2px solid var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip,.ghost,.copy{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.ghost{border-style:dashed;color:var(--mute);border-radius:10px}#thumb{max-height:64px;max-width:180px;border-radius:8px;display:none;object-fit:cover}
.go{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer}.go:disabled{opacity:.6;cursor:default}
.reply{margin-top:12px;margin-bottom:0}.reply p{margin:0 0 8px;font-size:17px}.why{color:var(--mute);font-size:14px!important}.copy{background:var(--chip);border-radius:10px}.msg{color:var(--mute);text-align:center;margin:14px 0}.err{color:var(--acc)}.note{font-size:13px;color:var(--mute);text-align:center;margin-top:18px}
</style></head><body><main>
<h1>Rizz <span>reply AI</span></h1><p class="sub">Paste the convo. Get replies that sound like you on a good day.</p>
<div class="card"><label class="h" for="chat">Their message / the chat</label><textarea id="chat" maxlength="12000" placeholder="Paste what they said (or the last few messages)…"></textarea>
<div class="row"><button class="ghost" id="up" type="button">+ Add screenshot</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden><img id="thumb" alt="Screenshot preview"><button class="ghost" id="rm" type="button" hidden>Remove</button></div></div>
<div class="card"><label class="h">Vibe (choose one or more)</label><div class="chips" id="vibes">
<button class="chip" aria-pressed="true" data-v="genuine">Genuine</button><button class="chip" aria-pressed="false" data-v="funny">Funny</button><button class="chip" aria-pressed="true" data-v="conversational">Conversational</button><button class="chip" aria-pressed="false" data-v="flirty">Flirty</button><button class="chip" aria-pressed="false" data-v="naughty">Naughty 🔥</button><button class="chip" aria-pressed="false" data-v="cold">Cold &amp; calculated 🧊</button></div>
<label class="h" style="margin-top:14px">Who is it</label><div class="chips" id="who"><button class="chip" aria-pressed="true" data-w="a crush">Crush</button><button class="chip" aria-pressed="false" data-w="a new match">New match</button><button class="chip" aria-pressed="false" data-w="someone I'm dating">Dating</button><button class="chip" aria-pressed="false" data-w="an ex">Ex</button></div></div>
<button class="go" id="go" type="button">Get replies</button><div id="out" aria-live="polite"></div><p class="note">Replies are suggestions. Make them yours.</p></main>
<script>
(()=>{const $=id=>document.getElementById(id),chat=$('chat'),go=$('go'),out=$('out'),file=$('file'),thumb=$('thumb'),rm=$('rm'),up=$('up');let imageFile=null,previewUrl=null,controller=null;
function msg(t,c=''){const p=document.createElement('p');p.className='msg '+c;p.textContent=t;out.replaceChildren(p)}
const vibes=()=>[...document.querySelectorAll('#vibes .chip[aria-pressed=true]')].map(b=>b.dataset.v);
document.querySelectorAll('#vibes .chip').forEach(b=>b.onclick=()=>{const all=[...document.querySelectorAll('#vibes .chip')],active=all.filter(x=>x.getAttribute('aria-pressed')==='true'),on=b.getAttribute('aria-pressed')==='true';if(on&&active.length===1)return;if(!on&&b.dataset.v==='cold'){all.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}if(!on)all.filter(x=>x.dataset.v==='cold').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',String(!on))});
document.querySelectorAll('#who .chip').forEach(b=>b.onclick=()=>document.querySelectorAll('#who .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b))));
up.onclick=()=>file.click();file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){msg('Choose a JPG, PNG, or WebP screenshot.','err');file.value='';return}if(f.size>5*1024*1024){msg('Screenshot must be 5 MB or smaller.','err');file.value='';return}if(previewUrl)URL.revokeObjectURL(previewUrl);imageFile=f;previewUrl=URL.createObjectURL(f);thumb.src=previewUrl;thumb.style.display='block';rm.hidden=false;out.replaceChildren()};
rm.onclick=()=>{imageFile=null;file.value='';thumb.style.display='none';thumb.removeAttribute('src');rm.hidden=true;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null};
function render(list){out.replaceChildren();list.forEach(r=>{const d=document.createElement('div');d.className='reply';const p=document.createElement('p');p.textContent=r.text;const w=document.createElement('p');w.className='why';w.textContent=r.why||'';const b=document.createElement('button');b.className='copy';b.type='button';b.textContent='Copy reply';b.onclick=async()=>{try{await navigator.clipboard.writeText(r.text);b.textContent='Copied!'}catch{const t=document.createElement('textarea');t.value=r.text;document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();b.textContent=ok?'Copied!':'Press and hold to copy'}setTimeout(()=>b.textContent='Copy reply',1400)};d.append(p,w,b);out.append(d)})}
go.onclick=async()=>{const text=chat.value.trim();if(!text&&!imageFile){msg('Paste a message or add a screenshot first.','err');return}if(controller)controller.abort();controller=new AbortController();const activeController=controller;const timeout=setTimeout(()=>activeController.abort(),45000);go.disabled=true;go.textContent='Thinking…';msg('Generating your replies…');try{const body=new FormData();body.append('text',text);body.append('vibes',JSON.stringify(vibes()));body.append('who',document.querySelector('#who .chip[aria-pressed=true]').dataset.w);if(imageFile)body.append('screenshot',imageFile);const response=await fetch('/api/replies',{method:'POST',body,signal:activeController.signal});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed.');if(!Array.isArray(data.replies)||data.replies.length!==3||!data.replies.every(r=>r&&typeof r.text==='string'&&r.text.trim()))throw new Error('The server returned an invalid response. Try again.');render(data.replies)}catch(e){msg(e.name==='AbortError'?'Request timed out or was cancelled. Try again.':e.message||'Could not get replies. Check your connection.','err')}finally{clearTimeout(timeout);go.disabled=false;go.textContent='Get replies';if(controller===activeController)controller=null}};
})();
</script></body></html>
